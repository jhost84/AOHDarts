<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibernian Dart League</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-green-900 text-white font-sans">

  <!-- Header -->
  <header class="bg-green-800 shadow-lg p-6 text-center">
    <h1 class="text-3xl font-bold text-gold">Hibernian Dart League</h1>
    <p class="text-lg text-gray-200">Standings • Schedule • Community</p>
  </header>

  <!-- Standings Section -->
  <section class="p-6 max-w-5xl mx-auto">
    <h2 class="text-2xl font-bold text-gold mb-4">League Standings</h2>
    <div class="overflow-x-auto">
      <table id="standingsTable" class="min-w-full bg-green-700 rounded-lg overflow-hidden shadow">
        <thead>
          <tr class="bg-green-600 text-white text-left">
            <th class="p-3">Team</th>
            <th class="p-3">Wins</th>
            <th class="p-3">Losses</th>
            <th class="p-3">Points</th>
          </tr>
        </thead>
        <tbody id="standingsBody">
          <tr><td colspan="4" class="p-3 text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-green-800 p-4 text-center text-gray-300 mt-6">
    &copy; 2025 Hibernian Dart League • Built with ❤️ and Darts
  </footer>

  <script src="app.js"></script>
</body>
</html>
